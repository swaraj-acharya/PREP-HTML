<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATE EE 2027 Study OS</title>
<meta name="description" content="Local-first adaptive GATE EE 2027 preparation system: planner, lectures, PYQs, revision, errors, tests, timer, analytics.">
<style>
:root{color-scheme:light;
--bg:#E4E8E8;--panel:#F3F5F5;--raised:#FFFFFF;--sunk:#ECEFEF;
--ink:#172024;--ink2:#3C484E;--muted:#5F6D74;--line:#C4CDD0;--line2:#D9DFE1;
--r:#B32E26;--y:#946600;--b:#1D58A5;--g:#27744A;
--r-s:#F4DDDA;--y-s:#F2E6C4;--b-s:#DBE6F4;--g-s:#D9ECE0;
--fd:Bahnschrift,"DIN Alternate","D-DIN","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
--fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--rad:6px;--sw:216px}
html[data-theme=dark]{color-scheme:dark;
--bg:#151B1E;--panel:#1C2427;--raised:#232C30;--sunk:#192023;
--ink:#E2E8EA;--ink2:#B4BFC4;--muted:#8D9AA0;--line:#35424A;--line2:#2B353B;
--r:#EF6D62;--y:#E2B849;--b:#72A8EE;--g:#5EBF88;
--r-s:#3B2422;--y-s:#373019;--b-s:#1B2C41;--g-s:#1A3426}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:.005em;line-height:1.2}
h2{font-size:17px}h3{font-size:15px}
p{margin:.3em 0}
a{color:var(--b)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--raised);padding:8px 12px;z-index:99}
.skip:focus{left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sw) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0 14px;overflow-y:auto}
.side::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,var(--r) 0 2px,var(--y) 2px 4px,var(--b) 4px 6px);opacity:.9}
.brand{padding:0 20px 12px}
.brand .b1{font-family:var(--fd);font-size:21px;font-weight:700;letter-spacing:.01em}
.brand .b2{color:var(--muted);font-size:12.5px}
.side-clock{margin:0 20px 12px;padding:10px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}
.side-clock b{font-family:var(--fd);font-size:18px;color:var(--ink);display:block;font-weight:600}
.nav{display:flex;flex-direction:column;padding:4px 12px 12px 10px;gap:1px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current=page]{background:var(--raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--b)}
.nav .cnt{font-size:11.5px;min-width:20px;text-align:center;border-radius:9px;padding:0 6px;background:var(--r-s);color:var(--r);font-weight:600}
.legend{margin-top:auto;padding:12px 20px 0;display:grid;gap:4px;font-size:12px;color:var(--muted);border-top:1px solid var(--line2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
.lr{background:var(--r)}.ly{background:var(--y)}.lb{background:var(--b)}
.main{min-width:0;padding:20px clamp(14px,2.6vw,32px) 90px;max-width:1380px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:24px;margin-right:auto}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
kbd{font:11px var(--fb);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);margin-left:4px}
.bnav{display:none}

/* ---------- controls ---------- */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--raised);border-radius:5px;padding:6px 11px;font-size:13px;line-height:1.3;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{opacity:.9}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--r);border-color:var(--r)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.in{background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px;min-width:0;max-width:100%}
.in:hover{border-color:var(--muted)}
textarea.in{width:100%;min-height:64px;resize:vertical}
.in.sm{padding:3px 6px;font-size:12.5px}
.in.num{width:74px}
.in.w100{width:100%}
select.in{padding-right:4px}
label.f{display:grid;gap:3px;font-size:12.5px;color:var(--ink2)}
label.f>span{font-weight:600}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.fg .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sp{flex:1}
.hint{color:var(--muted);font-size:12.5px}
.small{font-size:12.5px}
.mut{color:var(--muted)}
.b{font-weight:600}
.nowrap{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12.5px;border-right:1px solid var(--line);background:var(--raised)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--b)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:14px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ph h2{margin-right:auto}
.pb{padding:12px 14px}
.pb.tight{padding:6px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.empty{padding:18px 14px;color:var(--muted)}
.empty b{color:var(--ink)}

/* ---------- tags ---------- */
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;border:1px solid var(--line);background:var(--raised);white-space:nowrap}
.tag.t1{border-color:var(--ink2)}
.tag.t2{border-style:dashed}
.tag.t3{border-style:dotted;color:var(--muted)}
.lid{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.01em;white-space:nowrap}
.pri{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap}
.pri.must{background:var(--r-s);color:var(--r)}
.pri.should{background:var(--y-s);color:var(--y)}
.pri.optional{background:var(--b-s);color:var(--b)}
.flag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap}
.flag.od{background:var(--r);color:#fff}
.flag.due{background:var(--y-s);color:var(--y)}
.flag.weak{background:var(--r-s);color:var(--r)}
.flag.ok{background:var(--g-s);color:var(--g)}
.flag.info{background:var(--b-s);color:var(--b)}
.flag.prog{background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.src{font-size:11px;font-weight:600;padding:0 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.src.off{color:var(--g)}.src.hist{color:var(--y)}.src.res{color:var(--b)}.src.user{color:var(--ink2)}.src.asm{color:var(--r)}.src.rec{color:var(--muted)}

/* ---------- hero + load meter ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:14px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad)}
.hero .date{font-size:clamp(24px,3.2vw,34px);font-weight:600}
.hero .sub{color:var(--ink2);margin:0}
.meter{position:relative;margin-top:8px}
.meter .track{position:relative;height:30px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex}
.meter .seg-r{background:var(--r)}.meter .seg-y{background:var(--y)}.meter .seg-b{background:var(--b)}
.meter .track>div{height:100%;position:relative}
.meter .done{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.38) 0 5px,transparent 5px 10px)}
.meter .buf{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 4px,var(--line) 4px 5px);border-left:2px solid var(--ink)}
.meter .ticks{position:relative;height:16px;font-size:10.5px;color:var(--muted)}
.meter .ticks span{position:absolute;transform:translateX(-50%);top:2px}
.meter .ticks i{position:absolute;top:-4px;width:1px;height:5px;background:var(--muted)}
.meter-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.meter-legend b{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.inst{display:grid;gap:0}
.inst .it{padding:10px 14px;border-bottom:1px solid var(--line2)}
.inst .it:last-child{border-bottom:0}
.inst .it h3{font-size:13.5px;margin-bottom:4px;color:var(--ink2)}
.inst .big{font-family:var(--fd);font-size:20px;font-weight:600}
.verdict{font-weight:700}
.verdict.good{color:var(--g)}.verdict.warn{color:var(--y)}.verdict.bad{color:var(--r)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;border:1px solid var(--line2);margin:4px 0}
.bar>i{display:block;height:100%;background:var(--ink2)}
.bar.g>i{background:var(--g)}.bar.r>i{background:var(--r)}.bar.y>i{background:var(--y)}.bar.b>i{background:var(--b)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.kv span:nth-child(even){text-align:right;font-weight:600}
ol.tight,ul.tight{margin:4px 0;padding-left:18px}
ol.tight li,ul.tight li{margin:2px 0}
.banner{padding:10px 14px;border-radius:var(--rad);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line)}
.banner.warn{background:var(--y-s);border-color:var(--y)}
.banner.bad{background:var(--r-s);border-color:var(--r)}
.banner.info{background:var(--b-s);border-color:var(--b)}
.banner p{margin:0;flex:1;min-width:220px}

/* ---------- tasks ---------- */
.agenda{display:grid;gap:8px;padding:12px 14px}
.agroup{font-family:var(--fd);font-size:14px;font-weight:600;margin:6px 0 0;display:flex;gap:8px;align-items:center}
.agroup .ln{flex:1;height:1px;background:var(--line2)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line2);border-left:4px solid var(--c,var(--line));background:var(--raised);border-radius:3px 6px 6px 3px}
.task[data-p=must]{--c:var(--r)}.task[data-p=should]{--c:var(--y)}.task[data-p=optional]{--c:var(--b)}
.task.done{opacity:.62}
.task.done .t-title{text-decoration:line-through}
.task.dropped{opacity:.45}
.task.overdue{background:linear-gradient(90deg,var(--r-s),var(--raised) 60%)}
.chk{width:24px;height:24px;border-radius:5px;border:2px solid var(--c,var(--line));background:var(--raised);cursor:pointer;display:grid;place-items:center;font-weight:700;color:#fff;padding:0;margin-top:1px}
.task.done .chk{background:var(--c)}
.t-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.ttype{font-size:12px;color:var(--muted)}
.t-title{font-weight:600}
.t-meta,.t-why,.t-how{font-size:12.5px;color:var(--ink2);margin-top:2px}
.t-why b{color:var(--ink)}
.t-more summary{cursor:pointer;font-size:12px;color:var(--muted);margin-top:4px}
.t-more[open] summary{margin-bottom:6px}
.t-side{display:grid;gap:6px;justify-items:end}
.t-acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:600;color:var(--ink2);text-align:left;font-size:12px;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap;background:var(--panel);position:sticky;top:0}
.tbl td{border-bottom:1px solid var(--line2);padding:5px 8px;vertical-align:middle}
.tbl tr:hover td{background:var(--sunk)}
.tbl .in{width:100%}
.tbl select.in{width:auto;min-width:64px;max-width:240px}
.tbl td.num,.tbl th.num{text-align:right}
.mast{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.mast i{width:38px;height:6px;border-radius:3px;background:var(--sunk);border:1px solid var(--line2);position:relative;overflow:hidden}
.mast i b{position:absolute;inset:0 auto 0 0;background:var(--mc,var(--ink2))}
.pager{display:flex;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);padding:0 10px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 10px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--b)}
.tabs .c{font-size:11px;margin-left:4px;color:var(--muted)}

/* ---------- calendar ---------- */
.strip{display:flex;align-items:flex-end;gap:1px;height:70px;padding:8px 14px 0}
.strip button{all:unset;cursor:pointer;flex:1;min-width:2px;background:var(--line);position:relative;border-radius:1px 1px 0 0}
.strip button.ov{background:var(--r)}
.strip button.done{background:var(--g)}
.strip button.td{outline:2px solid var(--ink);outline-offset:1px}
.strip-ax{display:flex;justify-content:space-between;padding:4px 14px 10px;font-size:11px;color:var(--muted)}
.cal-m{padding:10px 14px 14px}
.cal-m h3{margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;min-height:92px;border:1px solid var(--line2);background:var(--raised);border-radius:4px;padding:5px 6px;font-size:11.5px;display:flex;flex-direction:column;gap:2px;position:relative}
.cell:hover{border-color:var(--ink2)}
.cell:focus-visible{outline:2px solid var(--b)}
.cell.out{visibility:hidden}
.cell.rest{background:var(--sunk)}
.cell.today{border:2px solid var(--ink)}
.cell.ov{border-top:4px solid var(--r)}
.cell.load{box-shadow:inset 0 -3px 0 var(--y)}
.cell.cmp{background:var(--g-s)}
.cell .dn{font-family:var(--fd);font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.cell .ln2{color:var(--ink2);display:flex;justify-content:space-between;gap:4px}
.cell .ic{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cell .ic span{font-size:10.5px;padding:0 4px;border-radius:2px;background:var(--sunk);color:var(--ink2)}
.cal-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 12px}

/* ---------- syllabus ---------- */
details.sec{border-bottom:1px solid var(--line2)}
details.sec>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"+";font-family:var(--fd);width:14px;color:var(--muted)}
details.sec[open]>summary::before{content:"\2212"}
.topic{padding:4px 14px 10px 38px}
.topic h4{font-size:13.5px;margin:6px 0 4px;display:flex;gap:8px;align-items:center}
.subrow{display:grid;grid-template-columns:minmax(180px,1.6fr) 150px 90px minmax(160px,1.2fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line2);font-size:13px}

/* ---------- timer ---------- */
.clock{font-family:var(--fd);font-size:clamp(46px,9vw,84px);font-weight:600;letter-spacing:.02em;line-height:1;text-align:center;padding:10px 0}
.clock.run{color:var(--g)}
.clock.pause{color:var(--y)}
.tctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tctl .btn{padding:9px 16px;font-size:14px}
.chip-run{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--g-s);color:var(--g);cursor:pointer;border:0}
.chip-run.pz{background:var(--y-s);color:var(--y)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--fb)}
.chart .ax{stroke:var(--line)}
.chart .gl{stroke:var(--line2)}
.chart .s0{fill:var(--ink2)}.chart .s1{fill:var(--b)}.chart .s2{fill:var(--g)}.chart .s3{fill:var(--r)}.chart .s4{fill:var(--y)}.chart .sl{fill:var(--line)}
.chart .l0{stroke:var(--ink);fill:none;stroke-width:2}.chart .l1{stroke:var(--b);fill:none;stroke-width:2}.chart .l3{stroke:var(--r);fill:none;stroke-width:1.5;stroke-dasharray:4 3}
.chart .dot{fill:var(--ink)}
.chart .hm0{fill:var(--sunk)}.chart .hm1{fill:#9CC7AE}.chart .hm2{fill:#5FA67D}.chart .hm3{fill:#2F7D52}.chart .hm4{fill:#1B5436}
html[data-theme=dark] .chart .hm1{fill:#2A4A38}html[data-theme=dark] .chart .hm2{fill:#3B7152}html[data-theme=dark] .chart .hm3{fill:#4FA273}html[data-theme=dark] .chart .hm4{fill:#7ED3A2}
.clegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 10px}

/* ---------- modal / search / toast ---------- */
#modal,#search{position:fixed;inset:0;z-index:50}
.mw{position:fixed;inset:0;background:rgba(10,16,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 12px;overflow-y:auto}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md.wide{max-width:920px}
.md-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.md-h h2{margin-right:auto}
.md-b{padding:14px 16px}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding-top:12px;margin-top:12px;border-top:1px solid var(--line2);flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:2px 8px;border-radius:4px;color:var(--muted)}
.x:hover{background:var(--sunk);color:var(--ink)}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%;max-width:680px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:14px 16px;font-size:16px;outline:none}
.sres{max-height:60vh;overflow-y:auto;padding:6px}
.sres .grp{font-size:11.5px;color:var(--muted);padding:8px 10px 2px;font-weight:600}
.sres button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:7px 10px;border-radius:5px;font-size:13px}
.sres button:hover,.sres button.sel{background:var(--raised);box-shadow:inset 3px 0 0 var(--b)}
.sres .sm2{color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:6px;pointer-events:none}

 .bnav::before{content:"";position:absolute;left:0;right:0;top:-4px;height:3px;background:linear-gradient(180deg,var(--r) 0 1px,var(--y) 1px 2px,var(--b) 2px 3px)}

  const add = o => { const t = mkTask(Object.assign({ origin: 'remediation', testId: test.id }, o)); S.tasks.push(t); made.push(t); };
  weak.forEach(w => {
    addRev({ subject: w.subject, source: 'test', ref: test.id + ':' + (w.id || w.label), label: 'Weak in ' + (test.name || 'test') + ': ' + w.label, firstIn: 1, stage: 1, syl: w.id });
    add({ date: t1, type: 'remed', subject: w.subject, pri: 'must', est: 40, title: 'Retrieval-first fix: ' + w.label, how: 'Recall from memory, name the exact gap, review notes, watch only the lecture section that covers it if recall failed, solve one question, log the mistake.', why: `Flagged weak in ${test.name || 'a test'} on ${fmtS(test.date)}.` });
    const lecs = w.id ? (idx().lecBySyl[w.id] || []) : [];
    if (lecs.length) add({ date: t1, type: 'remed', subject: w.subject, pri: 'optional', est: 30, title: 'Targeted replay, only if recall failed: ' + lecs.slice(0, 4).map(l => l.id).join(', '), how: 'Replay only the section covering the gap, not the whole lecture.', why: 'These slots are mapped to the weak topic.' });
    add({ date: t2, type: 'pyq', subject: w.subject, pri: 'must', est: 40, title: 'Targeted PYQs: ' + w.label, how: 'About 8 to 10 PYQs on this topic; log each.', why: 'Re-test the fix on fresh questions.' });
  });
  if (!weak.length) (test.subjects || []).slice(0, 2).forEach(sid => add({ date: t1, type: 'remed', subject: sid, pri: 'must', est: 45, title: 'Remediation: ' + sid + ' (score below threshold)', how: 'Map lost marks to syllabus topics first; then retrieval-first revision of the two costliest topics.', why: `Score below your ${S.settings.remedThreshold}% threshold.` }));
  const top = Object.entries(test.mistakes || {}).filter(([, n]) => +n > 0).sort((a, b) => b[1] - a[1]).slice(0, 2);
  top.forEach(([cat]) => add({ date: t2, type: 'practice', pri: 'should', est: 20, title: 'Drill for ' + cat.toLowerCase(), how: ERR_FIX[cat] || 'Targeted drill.', why: `${cat} was a leading cause of lost marks in this test.` }));
  add({ date: t7, type: 'test', pri: 'should', est: 60, subject: (test.subjects || [])[0] || '', title: 'Re-test: ' + (weak.map(w => w.label).slice(0, 3).join(', ') || (test.subjects || []).join(', ') || 'weak areas'), how: 'Short timed test on the remediated topics only.', why: 'Confirms the fix held after a week.' });
  test.remediated = today();
  return made;
}

/* ---------------- recovery (missed days) and pull-forward ---------------- */
function recoveryAction(t) {
  if (LEARN_TYPES.includes(t.type)) return { a: 'requeue', label: t.pri === 'must' ? 'Back to the front of its lane (Tier 1 protected)' : 'Back to its lane queue; lower tiers absorb the shortfall first' };
  if (t.origin !== 'plan') return { a: 'today', label: 'Moved to today' };
  if (t.type === 'analysis') { const done = S.tasks.some(x => x.type === 'test' && x.date === t.date && x.status === 'done'); return done ? { a: 'today', label: 'Moved to today (the test was taken)' } : { a: 'drop', label: 'Dropped with its untaken test' }; }
  if (t.type === 'recall') return { a: 'recall', label: 'Converted to revision items due today for slots that were covered' };
  if (t.type === 'revision') return { a: 'drop', label: 'Dropped; due items stay in the revision queue, ranked by overdue days' };
  if (t.type === 'pyq') return { a: 'drop', label: t.pri === 'must' ? 'Folded into the next PYQ blocks' : 'Dropped (optional)' };
  if (t.type === 'test') return { a: 'drop', label: 'Dropped; the next scheduled test covers it' };
  return { a: 'drop', label: t.pri === 'optional' ? 'Dropped (optional)' : 'Dropped (movable, low cost to skip)' };
}
function recoveryReserved() {
  const t0 = today(), r = new Set();
  S.tasks.forEach(t => { if (t.lectureId && t.status === 'open' && t.origin !== 'plan') r.add(t.lectureId); if (t.lectureId && t.status === 'open' && t.date >= t0 && t.origin !== 'plan') r.add(t.lectureId); });
  return r;
}
function recoveryPreview(absorb) {
  const t0 = today(), rec = absorb ? { from: t0, until: addD(t0, 6), buffer: Math.round(+S.settings.bufferPct / 2) } : null;
  const p = buildPlan({ from: t0, reserved: recoveryReserved(), recovery: rec, gate: gateFor() });
  const next7 = p.days.slice(0, 7).filter(d => d.cap > 0);
  return { plan: p, cov: tierPlanCoverage(new Set(Object.keys(p.placed))), load: next7.length ? sum(next7.map(d => d.planned)) / next7.length : 0, cap: next7.length ? sum(next7.map(d => d.cap)) / next7.length : 0 };
}
function applyRecovery(absorb) {
  const t0 = today(), od = overdueTasks();
  od.forEach(t => {
    const a = recoveryAction(t).a;
    if (a === 'requeue') { t.status = 'moved'; t.result = 'Re-queued by recovery on ' + fmtS(t0); }
    else if (a === 'today') { t.movedFrom = t.date; t.date = t0; if (t.origin === 'plan') t.origin = 'moved'; }
    else if (a === 'recall') { (t.lectures || []).forEach(id => { const l = S.lectures[id]; if (l && isCovered(l)) addRev({ subject: l.subject, source: 'lecture', ref: l.id, label: l.id + (l.title ? ': ' + l.title : ''), firstIn: 0, stage: 1 }); }); t.status = 'dropped'; t.result = 'Converted to revision items'; }
    else { t.status = 'dropped'; t.result = 'Dropped by recovery on ' + fmtS(t0); }
  });
  S.meta.recovery = absorb ? { from: t0, until: addD(t0, 6), buffer: Math.round(+S.settings.bufferPct / 2) } : null;
  S.meta.lastRecovery = { at: t0, n: od.length };
  VER++;
  const plan = buildPlan({ from: t0, gate: gateFor() });
  commitPlan(plan);
  return plan;
}
function pullCandidates() {
  const t0 = today(), seen = new Set(), out = [];
  S.tasks.filter(t => t.status === 'open' && t.date > t0 && LEARN_TYPES.includes(t.type))
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || PRI_RANK[a.pri] - PRI_RANK[b.pri])
    .forEach(t => { const k = laneOf(subj(t.subject)); if (seen.has(k) || out.length >= 3) return; seen.add(k); out.push(t); });
  return out;
}
function tier1PlanGap() {
  if (S.settings.strategy !== 'tier1' || today() > S.settings.targetDate) return false;
  const t1 = new Set(S.subjects.filter(s => s.tier === 1).map(s => s.id));
  const required = allLectures().filter(l => t1.has(l.subject) && isOpenLec(l) && l.plan !== 'skip');
  const planned = new Set(S.tasks.filter(t => t.origin === 'plan' && t.status === 'open' && t.lectureId && t.date >= today() && t.date <= S.settings.targetDate).map(t => t.lectureId));
  return required.some(l => !planned.has(l.id));
}
function runReplan(from) {
  const plan = buildPlan({ from: from || today(), gate: null });
  commitPlan(plan);
  const c = tierPlanCoverage(new Set(Object.keys(plan.placed)))[1];
  const label = c.p + c.c >= c.n ? '100% Tier-1 target scheduled' : `${c.p + c.c}/${c.n} Tier-1 slots scheduled`;
  toast(`Plan rebuilt from ${fmtS(plan.from)}: ${label}.`);
  return plan;
}
function autoReplanAfterProgress(reason = 'progress') {
  if (S.settings.strategy !== 'tier1' || today() > S.settings.targetDate) return null;
  if (overdueTasks().length) { S.meta.planDirty = true; save(); return null; }
  try {
    const plan = buildPlan({ from: today(), gate: null });
    commitPlan(plan);
    if (S.meta.lastPlan) S.meta.lastPlan.autoReason = reason;
    S.meta.planDirty = false;
    save();
    return plan;
  } catch (e) {
    S.meta.planDirty = true;
    save();
    return null;
  }
}

  const cats = ERR_CATS.filter(c => agg[c]);
  return `<div class="panel"><div class="ph"><h2>Tests and mocks</h2><button class="btn sm p" data-act="testAdd">Log a test</button></div>
  ${asc.length ? `<div class="pb">${trend}</div><div class="clegend"><span><i class="sw" style="background:var(--ink)"></i>Score %</span><span><i class="sw" style="background:var(--b)"></i>Accuracy % of attempted</span></div>` : '<div class="empty"><b>No tests logged yet.</b> Log chapter, subject, mixed, sectional tests or full mocks; poor results generate a remediation plan.</div>'}</div>

}

/* ---------- charts (inline SVG, no libraries) ---------- */
function chartSVG({ labels, bars = [], lines = [], h = 190, yMax, label = 'Chart', unit = '' }) {
  const W = 720, H = h, L = 38, R = 10, T = 12, B = 30, n = Math.max(1, labels.length), iw = W - L - R, ih = H - T - B;
  const vals = [...bars.flatMap(s => s.values), ...lines.flatMap(s => s.values)].filter(v => v != null && isFinite(v));
  const mx = yMax || Math.max(1, ...vals) * 1.12;
  const x = i => L + iw * (i + .5) / n, y = v => T + ih - ih * clamp(v, 0, mx) / mx;
  const bw = Math.max(1, iw / n * .78 / Math.max(1, bars.length));
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = mx * k / 4, yy = y(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 5}" y="${yy + 3}" text-anchor="end">${v >= 10 ? Math.round(v) : r1(v)}${unit}</text>`; }
  bars.forEach((s, si) => s.values.forEach((v, i) => { if (v == null) return; const x0 = x(i) - bars.length * bw / 2 + si * bw; g += `<rect class="${s.cls || 's0'}" x="${x0.toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw * .92).toFixed(1)}" height="${Math.max(0, T + ih - y(v)).toFixed(1)}"><title>${esc(labels[i])}: ${r1(v)}${unit}${s.name ? ' ' + esc(s.name) : ''}</title></rect>`; }));
  lines.forEach(s => { let d = ''; s.values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }); if (d) g += `<path class="${s.cls || 'l0'}" d="${d}"/>`; if (s.dots !== false && s.values.length <= 40) s.values.forEach((v, i) => { if (v != null) g += `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="2.2"><title>${esc(labels[i])}: ${r1(v)}${unit}</title></circle>`; }); });
  const every = Math.ceil(n / 12);
  labels.forEach((l, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(l)}</text>`; });
  g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function hbarSVG(rows, label) {
  const W = 720, rh = 22, L = 150, R = 60, H = rows.length * rh + 10;
  let g = '';
  rows.forEach((r, i) => {
    const y0 = 5 + i * rh; let xx = L; const tot = Math.max(1, r.total);
    g += `<text x="${L - 6}" y="${y0 + 14}" text-anchor="end">${esc(r.label)}</text>`;
    r.parts.forEach(p => { const w = (W - L - R) * p.v / tot; if (w > 0) g += `<rect class="${p.cls}" x="${xx.toFixed(1)}" y="${y0 + 3}" width="${w.toFixed(1)}" height="${rh - 8}"><title>${esc(r.label)} ${esc(p.name)}: ${p.v}</title></rect>`; xx += w; });
    g += `<text x="${W - R + 6}" y="${y0 + 14}">${esc(r.note || '')}</text>`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function heatSVG(days) {
  const cols = Math.ceil((days.length + (dow(days[0]) + 6) % 7) / 7), c = 14, L = 30, T = 16, W = L + cols * (c + 2) + 10, H = T + 7 * (c + 2) + 4;
  let g = ['Mon', 'Wed', 'Fri'].map((d, i) => `<text x="0" y="${T + (i * 2) * (c + 2) + 11}">${d}</text>`).join('');
  const off = (dow(days[0]) + 6) % 7;
  days.forEach((d, i) => { const k = i + off, cx = L + Math.floor(k / 7) * (c + 2), cy = T + (k % 7) * (c + 2), m = studyMin(d), tg = rawHours(d) * 60;
    const lv = m <= 0 ? 0 : tg ? (m / tg < .25 ? 1 : m / tg < .5 ? 2 : m / tg < .85 ? 3 : 4) : 2;
    g += `<rect class="hm${lv}" x="${cx}" y="${cy}" width="${c}" height="${c}" rx="2"><title>${fmt(d)}: ${fmtH(m)} of ${fmtH(tg)}</title></rect>`;
    if (pd(d).getDate() === 1) g += `<text x="${cx}" y="10">${MON[pd(d).getMonth()]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:${W * 1.4}px" role="img" aria-label="Study consistency heatmap">${g}</svg>`;
}

/* ---------- analytics ---------- */

function openRecovery() {

function openSearch() {
  const box = $('#search'); box.hidden = false;
  box.innerHTML = `<div class="mw" data-act="searchBg"><div class="sbox" role="dialog" aria-modal="true" aria-label="Search"><input id="sq" placeholder="Search lectures, topics, tasks, PYQs, errors, tests, notes" autocomplete="off" aria-label="Search"><div class="sres" id="sres" role="listbox"></div></div></div>`;
  $('#sq').addEventListener('input', runSearch); $('#sq').focus(); runSearch();

function closeSearch() { $('#search').hidden = true; $('#search').innerHTML = ''; }
function runSearch() {
  const q = ($('#sq').value || '').trim().toLowerCase(), out = $('#sres');

  const has = (...a) => a.join(' ').toLowerCase().includes(q), G = [];
  const add = (grp, items) => { if (items.length) G.push([grp, items.slice(0, 8)]); };
  add('Subjects', S.subjects.filter(s => has(s.id, s.name)).map(s => ['subj', s.id, s.id + ': ' + s.name, TIER_LABEL[s.tier]]));

  add('Tasks', S.tasks.filter(t => t.status !== 'moved' && has(taskTitle(t), t.notes, t.result)).sort((a, b) => Math.abs(diffD(today(), a.date)) - Math.abs(diffD(today(), b.date))).map(t => ['task', t.id, taskTitle(t), fmt(t.date) + ', ' + t.status]));
  add('PYQs', S.pyqs.filter(p => has(p.subject, p.year, p.ref, p.topic, p.notes)).map(p => ['pyq', p.id, p.subject + ' ' + pyqLabel(p), (p.topic || '') + ' ' + RES_LABEL[p.result || 'unattempted']]));

  add('Tests', S.tests.filter(t => has(t.name, t.type, t.notes, t.weakText)).map(t => ['test', t.id, t.name || t.type, fmtS(t.date)]));
  add('Notes', S.feynman.filter(n => has(n.concept, n.expl, n.trap, n.formula)).map(n => ['feyn', n.id, n.concept, n.subject]));
  add('Sessions', S.sessions.filter(s => has(s.label, s.note, s.subject)).map(s => ['sess', s.id, s.label || 'Session', fmtS(s.date) + ', ' + Math.round(s.min) + ' min']));
  out.innerHTML = G.length ? G.map(([g, it]) => `<div class="grp">${g}</div>` + it.map(([k, id, a, b]) => `<button role="option" data-act="searchGo" data-k="${k}" data-id="${esc(id)}">${esc(a)}<div class="sm2">${esc(b || '')}</div></button>`).join('')).join('') : '<div class="grp">No matches.</div>';
}
function searchGo(k, id) {
  closeSearch();
  const go = v => { UI.view = v; location.hash = v; render(); };
  if (k === 'subj') go('subjects');
  else if (k === 'lec') { UI.lecSubj = S.lectures[id].subject; UI.lecQ = ''; UI.lecPage = Math.floor((S.lectures[id].num - 1) / 50); go('lectures'); openLecEdit(id); }
  else if (k === 'syl') { UI.sylQ = SYL_BY_ID[id].name; go('syllabus'); }
  else if (k === 'task') { const t = S.tasks.find(x => x.id === id); if (t) openDay(t.date); }
  else if (k === 'pyq') { go('pyqs'); openPyqForm(id); }
  else if (k === 'err') { go('errors'); openErrForm(id); }
  else if (k === 'test') { go('tests'); openTestForm(id); }
  else if (k === 'feyn') { UI.revTab = 'feynman'; go('revision'); }
  else go('timer');
}

/* ---------- change handlers ---------- */
function applyEdit(el) {
  const [kind, id, field] = el.dataset.e.split('|');
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.num !== undefined) { v = v === '' ? null : +v; if (v != null && !isFinite(v)) return; }
  const obj = kind === 'lec' ? S.lectures[id] : kind === 'task' ? S.tasks.find(t => t.id === id) : kind === 'subj' ? subj(id) : kind === 'syl' ? (S.syl[id] || (S.syl[id] = {})) : null;
  if (!obj) return;
  if (kind === 'subj' && (field === 'tier' || field === 'order') && v == null) return;
  if (field === 'watchedPct' && v != null) v = clamp(v, 0, 100);
  obj[field] = v;
  if (el.dataset.dirty !== undefined) S.meta.planDirty = true;
  save();
  if (kind === 'subj') render(); else if (el.dataset.dirty !== undefined) renderChrome();
}
const PLAN_KEYS = ['startDate', 'targetDate', 'examStart', 'restDay', 'bufferPct', 'strategy', 'strictTiers', 't2Unlock', 't3Unlock', 'maxSubjects', 'testDay', 'defaultLecMin', 'playback', 'notesOverhead', 'fNotes', 'fHybrid', 'fRapid', 'revMin', 'pyqMinPerQ'];
const CH = {
  set(el) {

    if (ty === 'num') { v = +v; if (!isFinite(v)) return; if (el.min !== '' && v < +el.min) v = +el.min; if (el.max !== '' && v > +el.max) v = +el.max; }
    if (ty === 'bool') v = v === 'true';
    if (ty === 'date' && v && !isValidDate(v)) return;
    if (k === 'targetDate' && v <= S.settings.startDate) { toast('The target must be after the start date.'); el.value = S.settings.targetDate; return; }
    S.settings[k] = v; if (PLAN_KEYS.includes(k)) S.meta.planDirty = true; save(); renderChrome();
  },
  setHour(el) { const v = parseFloat(el.value); if (!isFinite(v)) return; S.settings.hours[+el.dataset.i] = clamp(v, 0, 16); S.meta.planDirty = true; save(); renderChrome(); },
  dayHours(el) { const d = el.dataset.d; if (el.value === '') delete S.settings.dayHours[d]; else S.settings.dayHours[d] = clamp(+el.value, 0, 16); S.meta.planDirty = true; refresh(); },
  dayNote(el) { S.dayNotes[el.dataset.d] = el.value; save(); },
  subjCount(el) {
    const s = subj(el.dataset.id), n = clamp(parseInt(el.value) || 0, 0, 400);

    if (lose.length && !confirm(`Reduce ${s.id} to ${n} lectures? ${lose.length} slots above ${n} will be removed${withData ? `, except ${withData} that hold your data (kept and flagged as extra)` : ''}.`)) { el.value = s.count; return; }
    s.count = n; syncLectures(); S.meta.planDirty = true; toast(`${s.id} now has ${n} lecture slots (${s.id}-L01 to ${lecId(s.id, n)}).`); refresh();
  },
  lecStatus(el) {
    const l = S.lectures[el.dataset.id], was = isCovered(l), v = el.value; l.status = v;
    if (v === 'completed') l.watchedPct = 100;

/* ---------- wiring & init ---------- */
function applyTheme() {
  const m = S.settings.theme, dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const b = $('#themeBtn'); if (b) b.textContent = m === 'auto' ? 'Theme: system' : m === 'dark' ? 'Theme: dark' : 'Theme: light';
}
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; const f = ACT[a.dataset.act]; if (f) f(a, e); });
document.addEventListener('change', e => { const el = e.target; if (!el.dataset) return; if (el.dataset.e) applyEdit(el); if (el.dataset.ch && CH[el.dataset.ch] && !(el.dataset.live !== undefined)) CH[el.dataset.ch](el, e); });
let typeT = null;
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !['lecF', 'pyqF', 'sylQ'].includes(el.dataset.ch) || el.tagName !== 'INPUT') return;
  clearTimeout(typeT); typeT = setTimeout(() => {
    const key = el.dataset.ch + (el.dataset.k || ''), pos = el.selectionStart; CH[el.dataset.ch](el);
    const n = $$('input[data-ch]').find(x => x.dataset.ch + (x.dataset.k || '') === key); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) { } }
  }, 260);
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) || e.target.isContentEditable;
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); if ($('#search').hidden) ACT.search(); else closeSearch(); return; }
  if (e.key === 'Escape') { if (!$('#search').hidden) closeSearch(); else if (!$('#modal').hidden) closeModal(); return; }
  if (!$('#search').hidden && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const bs = $$('#sres button'); if (!bs.length) return; let i = bs.findIndex(b => b.classList.contains('sel'));
    if (e.key === 'Enter') { (bs[i] || bs[0]).click(); e.preventDefault(); return; }
    e.preventDefault(); bs.forEach(b => b.classList.remove('sel')); i = e.key === 'ArrowDown' ? Math.min(bs.length - 1, i + 1) : Math.max(0, i - 1); bs[i].classList.add('sel'); bs[i].scrollIntoView({ block: 'nearest' });
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'localFileInput' || !e.target.files[0]) return;
  const file = e.target.files[0];
  const r = new FileReader();
  r.onload = () => {
    try {
      const text = String(r.result || '');
      if (text.trim()) loadProgressObject(JSON.parse(text));
      LOCAL_FILE_HANDLE = null;
      LOCAL_RESTORE_STATE = 'unsupported';
      LOCAL_FILE_NAME = file.name;
      LOCAL_FILE_DIRTY = true;
      updateLocalStatus();
      if (!S.tasks.length || (tier1PlanGap() && !overdueTasks().length && S.settings.strategy === 'tier1')) commitPlan(buildPlan({ strategy: 'tier1', gate: null }));
      render();
      toast('Progress loaded. This browser cannot keep a writable file handle; use Save Progress Now to download an updated JSON copy.', 6500);
    } catch (err) { toast('Local progress import failed: ' + err.message, 7000); }
    finally { e.target.value = ''; }
  };
  r.readAsText(file);
});

document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      const candidate = o && o.type === 'GATE_EE_2027_LOCAL_PROGRESS' && o.state ? o.state : o;
      if (!(o && o.type === 'GATE_EE_2027_PROGRESS') && (!candidate || !Array.isArray(candidate.subjects) || typeof candidate.lectures !== 'object')) throw new Error('Not a valid Study OS progress file');
      if (!confirm('Replace all current study data with this local progress file?')) return;
      if (o && o.type === 'GATE_EE_2027_PROGRESS') mergeLegacyProgressSnapshot(o); else { S = migrate(candidate); syncLectures(); }
      VER++; save(); applyTheme(); toast('Local progress imported.'); render();
    } catch (err) { toast('Import failed: ' + err.message + '. Nothing was changed.', 6000); }
  };
  r.readAsText(e.target.files[0]); e.target.value = '';
});
let lastDay = null;
function tick() {
  if (S.timer.state === 'running') $$('[data-clock]').forEach(x => x.textContent = fmtClock(timerMs()));
  const t = today(); if (t !== lastDay) { const first = lastDay === null; lastDay = t; if (!first) render(); }
}
async function init() {
  load(); applyTheme();
  const h = (location.hash || '').slice(1); if (VIEWS[h]) UI.view = h;
  render(); updateLocalStatus();
  await restoreRememberedLocalFile();
  if ((!S.tasks.length || (tier1PlanGap() && !overdueTasks().length)) && S.settings.strategy === 'tier1') {
    commitPlan(buildPlan({ strategy: 'tier1', gate: null }));
  }
  render(); updateLocalStatus(); lastDay = today();
  setInterval(tick, 1000);
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(applyTheme); }
  window.addEventListener('hashchange', () => { const v = (location.hash || '').slice(1); if (VIEWS[v] && v !== UI.view) { UI.view = v; render(); } });
}
init();
</script>
</body>
</html>
