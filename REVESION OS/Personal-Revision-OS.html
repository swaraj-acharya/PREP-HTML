<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Revision OS</title>
<style>
:root{--bg:#F1F2F5;--s:#FFFFFF;--s2:#F7F8FA;--t:#14161B;--m:#666E81;--l:#E1E3E9;--a:#3A46CF;--oa:#FFFFFF;--as:#ECEEFC;--ok:#12805A;--bad:#C03A27;--wn:#AE7214;
--sh:0 1px 2px rgba(20,22,27,.04),0 10px 28px -16px rgba(20,22,27,.16);
--serif:"Iowan Old Style","Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
--sans:ui-sans-serif,"Segoe UI Variable Text","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0D0F14;--s:#151820;--s2:#1A1D27;--t:#ECEEF4;--m:#8E95A8;--l:#262A36;--a:#929CFF;--oa:#0D0F14;--as:#1D2142;--ok:#4FCB9B;--bad:#FF7C69;--wn:#EDB34C;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;font:14.5px/1.55 var(--sans);background:var(--bg);color:var(--t);display:flex;min-height:100vh}
::selection{background:var(--as)}
/* sidebar */
nav{width:240px;padding:20px 14px 16px;border-right:1px solid var(--l);position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--t);color:var(--bg);display:grid;place-items:center;font:600 18px/1 var(--serif)}
.brand b{display:block;font:600 16px/1.2 var(--serif);letter-spacing:-.005em}.brand small{color:var(--m);font-size:12px}
.navcta{width:100%;margin:0 0 14px;padding:10px 12px}
nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--m);cursor:pointer;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{color:var(--t);background:color-mix(in srgb,var(--s) 60%,transparent)}
nav a.on{background:var(--s);color:var(--t);box-shadow:0 0 0 1px var(--l),var(--sh)}nav a.on svg{stroke:var(--a)}
nav i{font-style:normal;margin-left:auto;background:var(--a);color:var(--oa);border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:600;line-height:19px}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;background:transparent}
.sbtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--m)}
.sbtn span{min-width:0}.sbtn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbtn small{display:block;color:var(--m);font-size:12px;font-weight:400}
.sbtn.dirty small{color:var(--wn)}.sbtn.need small{color:var(--bad)}
.tmw{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:12px 13px;box-shadow:var(--sh)}
.tmw .tt{font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvs{font:300 28px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:4px 0 10px}.tmw.pz .tvs{color:var(--m)}
.tmw .row button{flex:1;padding:7px 8px;white-space:nowrap}.tmw .row button.ic{flex:none;padding:3px 9px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;animation:pl 2s ease-in-out infinite}
.pz .pulse,.paused .pulse{background:var(--wn);animation:none}
@keyframes pl{50%{opacity:.35}}
button.ic{padding:3px 8px;border-radius:8px;font-size:13px;line-height:1.2}
/* main */
main{flex:1;padding:44px 52px 90px;max-width:1120px;min-width:0}
h1{font:600 34px/1.15 var(--serif);letter-spacing:-.015em;margin:0 0 6px}
h2{font:600 19px/1.3 var(--serif);letter-spacing:-.005em;margin:40px 0 12px;color:var(--t)}
h3{margin:0 0 6px;font-size:16px;font-weight:600}
.sub{color:var(--m);margin:0 0 22px;max-width:72ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{padding:6px 0 26px}.hero .sub{margin:0 0 6px}.hero h1{font-size:42px}
.lede{font:400 21px/1.45 var(--serif);max-width:52ch;margin:10px 0 22px;color:var(--t)}.lede b{font-weight:600}
.box{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:18px 20px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));background:var(--s);border:1px solid var(--l);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.g>.box{min-width:0;border:0;border-radius:0;box-shadow:1px 0 0 var(--l),0 1px 0 var(--l);padding:18px 20px}
.g>.box.pick{cursor:pointer;transition:background .15s}.g>.box.pick:hover{background:var(--s2)}.g>.box.pick.on{box-shadow:inset 0 0 0 2px var(--a);background:var(--as)}
.big{font:600 32px/1.1 var(--serif);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em;margin-top:4px}
.lbl{font-size:12.5px;color:var(--m);font-weight:500}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
/* controls */
button{font:inherit;font-weight:500;border:1px solid var(--l);background:var(--s);color:var(--t);border-radius:10px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background .15s,filter .15s}
button:hover{border-color:color-mix(in srgb,var(--t) 25%,var(--l))}button:active{transform:translateY(1px)}
button.p{background:var(--a);color:var(--oa);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 18px -10px var(--a)}button.p:hover{filter:brightness(1.08)}
button.lg{padding:11px 20px;font-size:15px;border-radius:12px}
button.d{color:var(--bad)}button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--l);border-radius:10px;background:var(--s2);color:var(--t);margin-top:6px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px var(--as);background:var(--s)}
select{margin-top:0;background:var(--s)}
label{display:block;font-size:13px;color:var(--m);font-weight:500;margin-bottom:14px}
input[type=number]{max-width:260px}label.chk{display:flex;align-items:center;gap:9px;color:var(--t);margin:14px 0 0}label.chk input{width:auto;margin:0;accent-color:var(--a)}
code{font-size:12.5px;background:var(--s2);border:1px solid var(--l);border-radius:6px;padding:1px 5px}
/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--s);border:1px solid var(--l);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
td,th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--l);vertical-align:middle}tr:last-child>td{border-bottom:0}
th{font-size:12.5px;color:var(--m);font-weight:500;background:var(--s2)}
#mb table{box-shadow:none}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--s2);border:1px solid var(--l);color:var(--m);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}
.bar{height:6px;background:color-mix(in srgb,var(--l) 70%,transparent);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--a);border-radius:99px}
.cols{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:160px;padding:18px;background:var(--s);border:1px solid var(--l);border-radius:16px;box-shadow:var(--sh)}
.cols div{background:color-mix(in srgb,var(--a) 75%,var(--s));border-radius:5px 5px 2px 2px;min-height:3px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:12px;color:var(--m);text-align:center;padding-bottom:2px}
.cell{min-height:86px;border:1px solid var(--l);border-radius:12px;padding:7px 9px;cursor:pointer;background:var(--s);position:relative;font-size:12px;transition:border-color .15s}
.cell:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--l))}
.cell.sel{box-shadow:0 0 0 2px var(--a)}.cell.td{border-color:var(--a)}.cell.e{visibility:hidden}.cell b{font-size:12px;color:var(--m);font-weight:500}.cell .mn{font-weight:600;font-size:15px;display:block;margin-top:6px}
/* roadmap */
.trk{display:flex;min-width:260px}.nd{flex:1;position:relative;text-align:center;font-size:11.5px;color:var(--m);line-height:1.3}
.nd .dot{display:block;width:14px;height:14px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--l);background:var(--s);position:relative;z-index:1;font-size:9px;line-height:10px;color:var(--s)}
.nd+.nd::before{content:'';position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--l)}.nd.done::before{background:var(--ok)!important}
.nd.done .dot{background:var(--ok);border-color:var(--ok)}.nd.next .dot{border-color:var(--a)}.nd.now .dot{background:var(--a);border-color:var(--a);box-shadow:0 0 0 4px var(--as)}.nd.late .dot{background:var(--bad);border-color:var(--bad)}.nd.late{color:var(--bad)}
.nd .ndt{display:block;color:var(--t);font-weight:500}.nd.todo .ndt{color:var(--m);font-style:italic;font-weight:400}.nd.fin .dot{border-radius:4px}.nd.fin.done .dot{background:var(--wn);border-color:var(--wn)}
.fcg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.fc{border:1px solid var(--l);border-radius:12px;padding:8px 10px;background:var(--s);cursor:pointer;font-size:12px;color:var(--m);transition:border-color .15s}
.fc:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--l))}.fc .mn{font:600 20px/1.2 var(--serif);display:block;color:var(--t);margin-top:2px}.fc.sel{box-shadow:0 0 0 2px var(--a)}.fc.over{border-color:var(--bad)}.fc.over .mn{color:var(--bad)}.fc .bar{height:4px;margin-top:5px}.fc.td{border-color:var(--a)}
.box .fcg .fc{background:var(--s2)}
.tw{overflow-x:auto;border-radius:16px}.lk{cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--m) 60%,transparent);text-underline-offset:4px}.lk:hover{color:var(--a)}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--m);margin:12px 0}.leg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--l)}.leg .l1::before{background:var(--ok);border-color:var(--ok)}.leg .l2::before{background:var(--a);border-color:var(--a)}.leg .l3::before{background:var(--bad);border-color:var(--bad)}
.filerow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--l);border-radius:12px;background:var(--s2)}
.filerow .sub{margin:2px 0 0}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(8,10,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}#modal.on{display:flex}
#mb{background:var(--s);border:1px solid var(--l);border-radius:20px;padding:26px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:mi .18s ease-out}
#mb h3{font:600 21px/1.3 var(--serif);margin-bottom:8px}
@keyframes mi{from{opacity:0;transform:translateY(6px) scale(.985)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:14px;display:none;z-index:60;max-width:calc(100vw - 32px);width:max-content;text-align:center;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
/* full-screen focus timer */
#focus{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,40px);padding:80px 24px 70px;color:#EEF0F7;background:#0A0C12 radial-gradient(90% 70% at 50% 40%,#171B33 0%,#0A0C12 70%)}
#focus.on{display:flex;animation:fi .25s ease-out}@keyframes fi{from{opacity:0}}
.fx-top{position:absolute;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;color:#9AA1B8;font-size:14px;font-weight:500}
.fx-sub{text-align:center;max-width:90vw}.fx-sub .s{color:#9AA1B8;font-size:15px}
.fx-sub h2{font:500 clamp(26px,3.6vw,46px)/1.15 var(--serif);margin:6px 0 0;color:#fff;letter-spacing:-.01em}
.ring{position:relative;width:min(56vmin,560px);aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.08)}.ring .tk{stroke:rgba(255,255,255,.22)}.ring .pg{stroke:#9AA4FF;stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px rgba(154,164,255,.5))}
.clk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clk .tv{font:200 calc(min(56vmin,560px)*.165)/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.03em;transition:opacity .3s}
.clk small{color:#8D94AC;font-size:clamp(13px,1.6vmin,16px);margin-top:14px}
#focus.paused .tv{opacity:.4}#focus.paused .pg{stroke:#EDB34C;filter:none}
.fx-ctl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#focus button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#EEF0F7;border-radius:99px}
#focus button:hover{background:rgba(255,255,255,.11)}
.fx-ctl button{padding:13px 26px;font-size:15.5px}#focus .fx-ctl button.p{background:#EEF0F7;color:#0A0C12;border-color:transparent;box-shadow:none;min-width:140px}
#focus button.d{background:transparent;border-color:transparent;color:#FF8E7D}#focus button.gh{padding:7px 14px;font-size:13px}
.fx-hint{position:absolute;bottom:22px;display:flex;gap:18px;color:#6B7290;font-size:12.5px}
kbd{font:500 11.5px var(--sans);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 6px;margin-right:5px;color:#AEB4C8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){body{flex-direction:column}
nav{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;padding:8px 10px;gap:2px;border-right:0;border-bottom:1px solid var(--l);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand,.navcta,#sync{display:none}nav a{flex:none;padding:7px 10px}nav a svg{display:none}
.navfoot{position:fixed;left:10px;right:10px;bottom:10px;z-index:6;padding:0;margin:0}
main{padding:22px 16px 140px}.hero h1{font-size:32px}.lede{font-size:18px}.cell{min-height:58px;padding:5px}.cell .mn{font-size:12px}
.fx-top{left:16px;right:16px;top:14px}.ring{width:min(84vw,50vh)}.clk .tv{font-size:calc(min(84vw,50vh)*.165)}.fx-hint{display:none}.fx-ctl button{padding:12px 18px}}
</style></head><body>
<nav><div class="brand"><span class="mk">R</span><div><b>Revision OS</b><small>Personal study system</small></div></div>
<button id="cta" class="p navcta" onclick="A.newSession()">Start studying</button>
<a data-v="dash" onclick="go('dash')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
<a data-v="revision" onclick="go('revision')"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4M4 3v4h4M4 13a8 8 0 0 0 14.9 4M20 21v-4h-4"/></svg>Revision <i id="bd" hidden></i></a>
<a data-v="roadmap" onclick="go('roadmap')"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h7a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h7"/></svg>Roadmap</a>
<a data-v="sessions" onclick="go('sessions')"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Sessions</a>
<a data-v="calendar" onclick="go('calendar')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
<a data-v="analytics" onclick="go('analytics')"><svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-8M3 20h18"/></svg>Analytics</a>
<a data-v="settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
<div class="navfoot"><div id="sync"></div><div id="tm"></div></div></nav>
<main id="main">Loading…</main><div id="modal" onclick="if(event.target===this)A.close()"><div id="mb"></div></div><div id="toast"></div><div id="focus" role="dialog" aria-label="Study timer"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const day=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return day(d)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'—';const hm=m=>m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
/* DB */
const STORES=['sessions','revision','revhist','settings'];let DB;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('PersonalRevisionOS_v4',2);r.onupgradeneeded=()=>[...STORES,'meta'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const os=(s,m='readonly')=>DB.transaction(s,m).objectStore(s);
const all=s=>rq(os(s).getAll()),get=(s,id)=>rq(os(s).get(id)),put=(s,o)=>rq(os(s,'readwrite').put(o)).then(dirtied),del=(s,id)=>rq(os(s,'readwrite').delete(id)).then(dirtied),clr=s=>rq(os(s,'readwrite').clear()).then(dirtied);
const mput=o=>rq(os('meta','readwrite').put(o)),mget=id=>rq(os('meta').get(id)),mdel=id=>rq(os('meta','readwrite').delete(id));
function dirtied(r){markDirty();return r}
const setting=async(k,d)=>(await get('settings',k))?.value??d;
/* Revision engine (session-based, UI-independent) */
const POLICY={steps:[1,3,7,14,30]};
const stOf=i=>!i?'NEW':i.cw>0?(i.fails>=3?'FORGOTTEN':'WEAK'):i.step>=4?'STRONG':i.step>=3?'RECALLED':i.step>=1?'RECOGNIZED':'LEARNING';
const newItem=(sid,date)=>({id:sid,sid,step:0,due:addDays(date,1),attempts:0,correct:0,cc:0,cw:0,fails:0,lastConf:null,interval:1});
function applyResult(it,conf){const ok=conf>0,S=POLICY.steps,t=day(),b=it.step;it.attempts++;it.lastConf=conf;if(it.ms==null)it.ms=b;
if(ok){it.correct++;it.cc++;it.cw=0;if(conf>=3){it.step=Math.min(it.step+(conf>=4?2:1),S.length-1);it.ms=Math.max(it.ms,b+1)}}else{it.fails++;it.cw++;it.cc=0;it.step=0}

/* Roadmap engine: milestone path 1 → 3 → 7 → 14 → 30 days, then 30-day maintenance */

A.restore=async inp=>{const f=inp.files[0];if(!f)return;let b;try{b=JSON.parse(await f.text());if(b.backupVersion!==2||!b.data)throw new Error('This is not a valid Revision OS backup (.json, version 2). Choose a file exported from Settings → Export complete backup.')}catch(e){inp.value='';return alert(e instanceof SyntaxError?'This file is not a valid .json backup.':e.message)}
showRestore(b);inp.value=''};
function showRestore(b,h){S.bk=b;S.bkH=h||null;$('#mb').innerHTML=`<h3>${h?'Load '+esc(h.name):'Restore backup'}</h3><p class="sub">Created ${esc(b.createdAt)} · ${(b.data.sessions||[]).length} sessions</p><p><b>MERGE</b> keeps current data and adds/updates from the backup.<br><b>REPLACE</b> deletes current data first.</p><div class="row"><button class="p" onclick="A.doRestore(false)">Merge</button><button class="d" onclick="A.doRestore(true)">Replace</button><button onclick="A.close()">Cancel</button></div>${h?'<p class="sub" style="margin:14px 0 0">After loading, this file stays linked and future saves go into it.</p>':''}`;$('#modal').classList.add('on')}
A.doRestore=async rep=>{const b=S.bk;A.close();if(rep&&!confirm('REPLACE will permanently delete current data. Continue?'))return;if(rep)for(const s of STORES)await clr(s);for(const s of STORES)for(const r of b.data[s]||[])await put(s,r);TM=await get('settings','timer');FOCUS=false;drawTimer();if(S.bkH){FH=S.bkH;S.bkH=null;NEEDP=false;await mput({id:'file',h:FH});await A.saveFile(true)}toast('Restore complete');go('dash')};
A.wipe=async()=>{if(!confirm('Delete ALL data? Export a backup first.'))return;for(const s of STORES)await clr(s);TM=null;FOCUS=false;drawTimer();go('dash')};
openDB().then(async()=>{try{FH=(await mget('file'))?.h||null;AUTO=(await mget('auto'))?.v??true;const ls=(await mget('lastSave'))?.v;lastSave=ls?new Date(ls):null;if(FH&&FS)NEEDP=(await FH.queryPermission({mode:'readwrite'}))!='granted'}catch(e){console.error(e)}drawSync();TM=await get('settings','timer');FOCUS=!!TM?.running;drawTimer();go('dash')}).catch(e=>{$('#main').textContent='IndexedDB unavailable: '+e});
</script></body></html>
